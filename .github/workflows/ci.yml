name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check -e . pytest ruff basedpyright skills-ref
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: basedpyright
      - name: Test
        run: pytest
      - name: Validate Agent Skill
        run: agentskills validate "$GITHUB_WORKSPACE/skills/pz-b42-mp-modding-skill"
