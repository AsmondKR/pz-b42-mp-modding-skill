[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pz-b42-mp-modding-skill"
version = "0.12.0"
description = "Safety and validation tools for a Project Zomboid Build 42 multiplayer Agent Skill"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
pz-skill-discover = "pz_b42_mp_skill.discovery:main"
pz-skill-guard = "pz_b42_mp_skill.mutation_guard:main"
pz-skill-query = "pz_b42_mp_skill.api_query:main"
pz-skill-report = "pz_b42_mp_skill.evidence_report:main"
pz-skill-validate = "pz_b42_mp_skill.mod_validator_cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["skills/pz-b42-mp-modding-skill/src/pz_b42_mp_skill"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.isort]
known-first-party = ["pz_b42_mp_skill"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
extraPaths = ["skills/pz-b42-mp-modding-skill/src"]
include = [
  "skills/pz-b42-mp-modding-skill/src",
  "skills/pz-b42-mp-modding-skill/scripts",
]
